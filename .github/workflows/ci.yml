name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build linux/amd64 image
        run: |
          docker compose config --quiet
          docker build --platform linux/amd64 -t jm-bot:ci .
      - name: Check container imports and image size
        run: |
          docker run --rm jm-bot:ci python -c "import jm_bot, jmcomic, img2pdf, websockets; print('container imports OK')"
          docker image inspect jm-bot:ci --format 'platform={{.Os}}/{{.Architecture}} size_bytes={{.Size}}'
      - name: Start service against offline OneBot mock and measure idle RSS
        run: python scripts/container_smoke.py --image jm-bot:ci
      - name: Publish tested version to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/epiphany-leave/jm-bot:${RELEASE_TAG#v}"
          docker tag jm-bot:ci "$image"
          docker push "$image"
          docker logout ghcr.io

  verify-published:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pull anonymously and verify published container
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install websockets==17.4
          export DOCKER_CONFIG="$(mktemp -d)"
          image="ghcr.io/epiphany-leave/jm-bot:${RELEASE_TAG#v}"
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format 'platform={{.Os}}/{{.Architecture}} size_bytes={{.Size}}'
          python scripts/container_smoke.py --image "$image"
